name: Generate Error Pages

on:
  push:
    branches: [main]
    paths:
      - 'errors/template.html'
      - 'assets/**'
      - '.github/workflows/generate-errors.yml'
  workflow_dispatch:  # Allows manual trigger

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Generate error pages
        run: |
          mkdir -p errors/generated
          
          # Define error data: filename|code|title|description
          # NOTE: don't use | / & \ or double quotes inside descriptions,
          # they would break the field split or the sed replacement below.
          declare -a errors=(
            "bad-request|400|Bad Request|The server couldn't understand this request because something about it was malformed. Check the address or the data being sent and try again."
            "unauthorized|401|Unauthorized|You need to sign in or provide valid credentials to view this page. Without proper authentication, access is denied."
            "forbidden|403|Forbidden|The server understood your request but is refusing to let you in. You don't have permission to view this page or resource."
            "not-found|404|Not Found|We couldn't find anything at this address. The page may have been moved or deleted, or the link may have a typo."
            "method-not-allowed|405|Method Not Allowed|This page doesn't accept the type of request that was sent, such as trying to submit data to a page that only displays content."
            "timed-out|408|Request Timeout|The server waited too long for your request to finish arriving and gave up. This is usually caused by a slow or unstable connection, so try again."
            "content-too-large|413|Content Too Large|The data sent to the server is larger than it allows. Try sending something smaller, such as a smaller file."
            "uri-too-long|414|URI Too Long|The web address you used is too long for the server to handle. Try a shorter link or remove extra parameters from it."
            "too-many-requests|429|Too Many Requests|You've sent too many requests in a short time, so the server is limiting you. Wait a minute or so, then try again."
            "internal-server-error|500|Internal Server Error|Something went wrong on the server's end and it couldn't finish your request. It isn't anything you did, so try again in a bit."
            "bad-gateway|502|Bad Gateway|A server acting as a middleman got a bad response from the server behind it. This is usually temporary, so try again shortly."
            "service-unavailable|503|Service Unavailable|The server can't handle requests right now, usually because of maintenance or heavy traffic. Please try again soon."
          )
          
          for entry in "${errors[@]}"; do
            IFS='|' read -r slug code title desc <<< "$entry"
            
            # Find the image file (try multiple extensions)
            img=""
            for ext in gif jpg jpeg png webp; do
              if [[ -f "assets/${slug}.${ext}" ]]; then
                img="${slug}.${ext}"
                break
              fi
            done
            
            if [[ -z "$img" ]]; then
              echo "::warning::No image found for ${slug}, skipping..."
              continue
            fi
            
            # Replace placeholders
            sed -e "s/{{CODE}}/${code}/g" \
                -e "s/{{TITLE}}/${title}/g" \
                -e "s/{{DESCRIPTION}}/${desc}/g" \
                -e "s/{{IMAGE}}/${img}/g" \
                errors/template.html > "errors/generated/${code}.html"
            
            echo "Generated ${code}.html using ${img}"
          done
          
          # Also create a 404.html in root for GitHub Pages
          if [[ -f "errors/generated/404.html" ]]; then
            cp errors/generated/404.html 404.html
          fi
      
      - name: Commit generated files
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add errors/generated/ 404.html
          git diff --staged --quiet || git commit -m "Auto-generate error pages [skip ci]"
          git push
