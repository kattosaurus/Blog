# Simple workflow for deploying static content to Pages
name: Deploy static content to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Inject social footer into every HTML page
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import os
          import re

          root = Path.cwd()
          for page in root.rglob('*.html'):
              if '.git' in page.parts:
                  continue

              content = page.read_text(encoding='utf-8')
              if 'socials.js' in content:
                  continue

              script_path = os.path.relpath(root / 'socials.js', page.parent).replace(os.sep, '/')
              script_tag = f'<script src="{script_path}" defer></script>'
              updated, count = re.subn(
                  r'</body\s*>',
                  f'{script_tag}\n</body>',
                  content,
                  count=1,
                  flags=re.IGNORECASE,
              )
              if count:
                  page.write_text(updated, encoding='utf-8')
          PY
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Upload entire repository
          path: '.'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
