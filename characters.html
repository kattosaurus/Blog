<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta property="og:image" content="https://kattosaur.us/Online.png">
  <meta property="og:title" content="Katto">
  <meta property="og:description" content="Art, web development, and Minecraft mods by Katto.">
  <title>Characters | Katto dot online</title>
  <link rel="icon" href="favicon.ico">
  <style>
    :root { --bg-color:#121212; --header-bg:#000; --text-main:#fff; --text-muted:#ffffff9a; --prof-bg:#ffffff36; --btn-bg:#ffffff20; --btn-text:#fff; --dropdown-shadow:rgba(0,0,0,.5); --colored-button:#434ed4; --card-bg:#1a1a1a; --card-border:#ffffff15; --section-bg:#ffffff08; }
    [data-theme="light"] { --bg-color:#f0f0f0; --header-bg:#e0e0e0; --text-main:#121212; --text-muted:#1212129a; --prof-bg:#0000001a; --btn-bg:#00000015; --btn-text:#121212; --dropdown-shadow:rgba(0,0,0,.1); --colored-button:#151b68; --card-bg:#fff; --card-border:#00000015; --section-bg:#00000008; }
    * { box-sizing:border-box; margin:0; padding:0; }
    html { scroll-behavior:smooth; }
    body { min-height:100vh; background:var(--bg-color); transition:background-color .3s; font-family:system-ui,-apple-system,sans-serif; color:var(--text-main); padding-top:60px; }
    h1,h2,h3,h4 { margin:0; } p { font-weight:300; line-height:1.6; }
    .controls { position:fixed; top:15px; left:0; right:15px; display:flex; gap:10px; z-index:20; }
    .control-btn,.burger { color:var(--btn-text); background:var(--btn-bg); border:0; padding:8px 12px; border-radius:6px; cursor:pointer; font:500 14px system-ui; }
    .control-btn:hover,.burger:hover { background:var(--prof-bg); }
    .burger { margin-right:auto; background:transparent; font-size:20px; }
    .dropdown { display:flex; flex-direction:column; position:fixed; top:60px; left:15px; background:var(--header-bg); min-width:180px; border-radius:8px; box-shadow:0 8px 24px var(--dropdown-shadow); border:1px solid var(--btn-bg); overflow:hidden; z-index:100; opacity:0; visibility:hidden; transform:translateY(-10px); pointer-events:none; transition:.25s; }
    .dropdown.show { opacity:1; visibility:visible; transform:translateY(0); pointer-events:auto; }
    .dropdown a { color:var(--text-main); padding:12px 16px; text-decoration:none; font-size:14px; font-weight:500; }
    .dropdown a:hover { background:var(--prof-bg); }
    .dropdown .separator { height:1px; background:var(--btn-bg); margin:4px 0; }
    .tab-container { width:100%; max-width:1000px; margin:0 auto; padding:20px 20px 60px; animation:slideUp .6s ease-out; }
    @keyframes slideUp { from {opacity:0;transform:translateY(30px)} to {opacity:1;transform:translateY(0)} }
    .tab-container h2 { font-size:2rem; margin-bottom:.5rem; }
    .intro-text { font-size:1.05rem; color:var(--text-muted); margin-bottom:2rem; }
    .char-group { margin-top:2.5rem; } .char-group:first-child { margin-top:0; }
    .group-title { font-size:1.5rem; font-weight:600; margin-bottom:1rem; padding-bottom:.65rem; border-bottom:1px solid var(--card-border); }
    .char-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(260px,1fr)); gap:20px; }
    .char-card { background:var(--card-bg); border-radius:20px; overflow:hidden; border:1px solid var(--card-border); transition:all .3s ease; display:flex; flex-direction:column; }
    .char-card:hover { transform:translateY(-6px); box-shadow:0 12px 32px var(--dropdown-shadow); border-color:var(--prof-bg); }
    .char-accent { height:5px; width:100%; flex-shrink:0; }
    .char-img-wrap { width:100%; aspect-ratio:1; overflow:hidden; display:flex; align-items:center; justify-content:center; background:var(--section-bg); }
    .char-img-wrap img { width:100%; height:100%; object-fit:cover; display:block; transition:transform .4s ease; }
    .char-card:hover .char-img-wrap img { transform:scale(1.05); }
    .char-info { padding:18px 20px 22px; display:flex; flex-direction:column; gap:8px; }
    .char-name { font-size:1.25rem; font-weight:600; color:var(--text-main); text-decoration:none; }
    .char-name:hover { color:var(--colored-button); }
    .char-desc { font-size:.88rem; color:var(--text-muted); line-height:1.5; display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical; overflow:hidden; }
    .char-link { margin-top:auto; padding-top:10px; font-size:.8rem; color:var(--colored-button); text-decoration:none; font-weight:500; align-self:flex-start; }
    .char-link:hover { opacity:.7; }
    .loading-state,.error-state { text-align:center; padding:80px 20px; }
    .loading-state { color:var(--text-muted); font-weight:300; font-size:1.1rem; } .error-state { color:#ff4747; }
    @media(max-width:600px) { .char-grid { grid-template-columns:1fr; } .tab-container { padding:16px 16px 50px; } }
    ::-webkit-scrollbar { width:6px; } ::-webkit-scrollbar-track { background:transparent; } ::-webkit-scrollbar-thumb { background:var(--btn-bg); border-radius:10px; }
  </style>
</head>
<body>
  <div class="controls">
    <button id="burger" class="burger" onclick="toggleDropdown()">≡</button>
    <button id="theme-toggle" class="control-btn" data-en="Theme" data-es="Tema">Theme</button>
    <button id="lang-toggle" class="control-btn">EN</button>
  </div>
  <div class="dropdown" id="dropmeow">
    <a href="index.html" data-en="Home" data-es="Inicio">Home</a>
    <a href="index.html#about" data-en="About myself" data-es="Sobre mí">About myself</a>
    <a href="index.html#services" data-en="My services" data-es="Mis servicios">My services</a>
    <a href="portfolio.html" data-en="Portfolio" data-es="Portafolio">Portfolio</a>
    <a href="commission.html" data-en="Commission me" data-es="Comisiones">Commission me</a>
    <div class="separator"></div>
    <a href="characters.html" data-en="My characters" data-es="Mis personajes">My characters</a>
    <a href="stories.html" data-en="Stories" data-es="Historias">Stories</a>
  </div>
  <main class="tab-container">
    <h2 data-en="My Characters" data-es="Mis Personajes">My Characters</h2>
    <p class="intro-text" data-en="A collection of my original characters (OCs). Click any card to learn more about them." data-es="Una colección de mis personajes originales (OCs). Haz clic en cualquier tarjeta para saber más sobre ellos.">A collection of my original characters (OCs). Click any card to learn more about them.</p>
    <div id="char-groups"><p class="loading-state" data-en="Loading characters..." data-es="Cargando personajes...">Loading characters...</p></div>
  </main>
  <script>
    let currentLang = 'en';
    const langBtn = document.getElementById('lang-toggle');
    langBtn.addEventListener('click', () => {
      currentLang = currentLang === 'en' ? 'es' : 'en';
      langBtn.textContent = currentLang.toUpperCase();
      document.querySelectorAll('[data-en]').forEach(el => { const text = el.getAttribute(`data-${currentLang}`); if (text) el.textContent = text; });
    });
    document.getElementById('theme-toggle').addEventListener('click', () => {
      const root = document.documentElement;
      root.setAttribute('data-theme', root.getAttribute('data-theme') === 'light' ? 'dark' : 'light');
    });
    function toggleDropdown() { document.getElementById('dropmeow').classList.toggle('show'); }
    window.onclick = event => {
      if (!event.target.matches('.burger')) document.querySelectorAll('.dropdown.show').forEach(dropdown => dropdown.classList.remove('show'));
    };
    const groupsContainer = document.getElementById('char-groups');
    function extractDocLink(desc) { const match = desc.match(/https:\/\/docs\.google\.com\/[^\"]+/); return match ? match[0] : null; }
    function cleanDescription(desc) { return desc.replace(/https:\/\/[^\s]+/g, '').replace(/::\s*/g, ' • ').trim(); }
    function renderCharacter(char, grid) {
      const card = document.createElement('article'); card.className = 'char-card';
      const accent = document.createElement('div'); accent.className = 'char-accent'; accent.style.backgroundColor = char.color || '#999'; card.appendChild(accent);
      const imageWrap = document.createElement('div'); imageWrap.className = 'char-img-wrap';
      const image = document.createElement('img'); image.src = char.image; image.alt = char.name; image.loading = 'lazy'; image.onerror = () => { image.style.display = 'none'; };
      imageWrap.appendChild(image); card.appendChild(imageWrap);
      const info = document.createElement('div'); info.className = 'char-info';
      const name = document.createElement('a'); name.className = 'char-name'; name.textContent = char.name; name.href = `oc.html?name=${encodeURIComponent(char.name)}`;
      const description = document.createElement('div'); description.className = 'char-desc'; description.textContent = cleanDescription(char.description || ''); info.append(name, description);
      const docLink = extractDocLink(char.description || '');
      if (docLink) { const link = document.createElement('a'); link.href = docLink; link.target = '_blank'; link.rel = 'noopener noreferrer'; link.className = 'char-link'; link.textContent = 'More info →'; info.appendChild(link); }
      card.appendChild(info); grid.appendChild(card);
    }
    function renderGroup(groupName, characters) {
      if (!characters.length) return;
      const section = document.createElement('section'); section.className = 'char-group';
      const heading = document.createElement('h3'); heading.className = 'group-title'; heading.textContent = groupName; section.appendChild(heading);
      const grid = document.createElement('div'); grid.className = 'char-grid'; characters.forEach(char => renderCharacter(char, grid));
      section.appendChild(grid); groupsContainer.appendChild(section);
    }
    async function loadCharacters() {
      try {
        const [charactersRes, manifestRes] = await Promise.all([fetch('ocs/characters.json', {cache:'no-cache'}), fetch('ocs/manifest.json', {cache:'no-cache'})]);
        if (!charactersRes.ok || !manifestRes.ok) throw new Error('Could not load characters or manifest');
        const [characters, manifest] = await Promise.all([charactersRes.json(), manifestRes.json()]);
        if (!Array.isArray(characters) || !Array.isArray(manifest.groups)) throw new Error('Invalid character list or manifest');
        const charactersByName = new Map(characters.map(char => [char.name, char]));
        const assignedNames = new Set(); groupsContainer.replaceChildren();
        manifest.groups.forEach(group => {
          if (typeof group.name !== 'string' || !Array.isArray(group.characters)) return;
          const members = group.characters.filter(name => typeof name === 'string' && !assignedNames.has(name)).map(name => { assignedNames.add(name); return charactersByName.get(name); }).filter(Boolean);
          renderGroup(group.name, members);
        });
        renderGroup(manifest.ungroupedGroup || 'Other OCs', characters.filter(char => !assignedNames.has(char.name)));
      } catch (error) {
        console.error(error);
        groupsContainer.innerHTML = '<p class="error-state" data-en="Could not load characters." data-es="No se pudieron cargar los personajes.">Could not load characters.</p>';
      }
    }
    loadCharacters();
  </script>
</body>
</html>
