<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta property="og:title" content="Changed Addon Mods">
<meta property="og:description" content="A ranked list of Changed: Minecraft Mod addons, with descriptions and community servers.">
<title>Changed Addon Mods</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg-color:#121212;--header-bg:#000;--text-main:#fff;--text-muted:#ffffff9a;--prof-bg:#ffffff36;--star-color:#fff;--star-opacity-min:.4;--star-filter:drop-shadow(0 0 2px rgba(255,255,255,.9));--btn-bg:#ffffff20;--colored-button:#434ed4}
html{scroll-behavior:smooth;overflow-x:hidden;width:100%;font-size:16px}
body{min-height:100dvh;width:100%;overflow-x:hidden;background:var(--bg-color);font-family:system-ui,-apple-system,sans-serif;color:var(--text-main);-webkit-text-size-adjust:100%}
h1{margin:0}
p{font-weight:300;font-size:1rem;line-height:1.6}
.header{background:var(--header-bg);width:100%;display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px;padding:80px 20px 40px;position:relative;overflow:hidden}
.your{font-weight:300;color:var(--text-muted);font-size:1.25rem;z-index:1}
.profs{display:inline-block;background:var(--prof-bg);padding:10px 14px;font-size:1.5rem;z-index:1}
.star{position:absolute;background:var(--star-color);border-radius:50%;pointer-events:none;will-change:transform,opacity;transform:translate3d(0,0,0);filter:var(--star-filter);animation:tw var(--duration) infinite ease-in-out}
@keyframes tw{0%,100%{opacity:var(--star-opacity-min);transform:translate3d(0,0,0) scale(.8)}50%{opacity:1;transform:translate3d(var(--move-x),var(--move-y),0) scale(1.2)}}
section{max-width:960px;margin:0 auto;padding:20px}
h2{font-size:1.25rem;margin-bottom:.75rem;font-weight:600}
.warn{font-weight:600}
.note{font-size:.8rem;opacity:.5;text-align:center;padding:30px 20px}
.rank{list-style:none;display:flex;flex-direction:column;gap:6px}
.rank li{background:var(--header-bg);border-radius:14px;padding:10px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.rank .n{opacity:.5;min-width:1.8em;font-weight:600}
.rank a{color:var(--text-main);font-weight:500;text-decoration:none;flex:1;min-width:140px}
.rank a:hover{text-decoration:underline}
.rank .d{font-weight:600}
.src{font-size:.75rem;opacity:.45}
.tag{font-size:.75rem;background:var(--btn-bg);padding:3px 10px;border-radius:20px;opacity:.85}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px}
.servicebox{background:var(--header-bg);padding:24px 20px;border-radius:24px;display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center}
.servicebox h3{font-size:1.15rem}
.servicebox p{font-size:.9375rem;line-height:1.5}
.dl{font-size:.8rem;opacity:.5}
.btns{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:auto;padding-top:6px}
.more{background:var(--colored-button);padding:10px 20px;color:#fff;text-decoration:none;border-radius:30px;min-height:44px;display:flex;align-items:center;justify-content:center;font-size:.9375rem;font-weight:500}
.more.alt{background:var(--btn-bg)}
.loading,.err{text-align:center;padding:40px 20px;opacity:.6}
@media(min-width:768px){html{font-size:17px}h2{font-size:1.5rem}.your{font-size:1.5rem}.profs{font-size:2rem}}
@media(min-width:1200px){html{font-size:18px}h2{font-size:1.75rem}}
@media(max-width:480px){.header{padding:60px 16px 32px}section{padding:16px}.servicebox{padding:20px 16px;border-radius:20px}}
</style>
</head>
<body>

<div class="header">
  <h1 class="your">A ranked list of</h1>
  <h1 class="profs">Changed Addons</h1>
</div>

<section>
  <h2>About this list</h2>
  <p class="warn">MOST OF THESE REQUIRE YOU TO BE 16+!</p>
  <p>Addons for Changed: Minecraft Mod, with what each one does and where its community hangs out. Download counts combine CurseForge and Modrinth.</p>
</section>

<section>
  <h2>Ranked by downloads</h2>
  <ol class="rank" id="rank"><li class="loading">Loading…</li></ol>
</section>

<div id="groups"></div>

<p class="note" id="note"></p>

<script>
const CF='https://www.curseforge.com/minecraft/mc-mods/', MR='https://modrinth.com/mod/';
const $=id=>document.getElementById(id);

const fmt=n=>n<1000?String(n):n<1e6?(n/1000).toFixed(n<1e4?1:1).replace(/\.0$/,'')+'K':(n/1e6).toFixed(2).replace(/\.?0+$/,'')+'M';

async function getJSON(url){const r=await fetch(url,{cache:'no-cache'});if(!r.ok)throw new Error(url+' '+r.status);return r.json();}

// Live Modrinth counts straight from the browser (their API allows CORS).
async function liveModrinth(slugs){
  const out={};
  if(!slugs.length)return out;
  for(let i=0;i<slugs.length;i+=100){
    const ids=encodeURIComponent(JSON.stringify(slugs.slice(i,i+100)));
    const list=await getJSON('https://api.modrinth.com/v2/projects?ids='+ids);
    list.forEach(p=>{out[p.slug.toLowerCase()]=p.downloads;});
  }
  return out;
}

function render(data,dl,updated){
  const mods=data.mods.map(m=>{
    const d=dl[m.cf]||{};
    const cf=d.cf??0, mr=d.mr??0;
    return {...m,cfN:cf,mrN:mr,total:cf+mr};
  });
  const G=data.groups;

  $('rank').innerHTML=[...mods].sort((a,b)=>b.total-a.total).map((m,i)=>{
    const src=m.mr?`<span class="src">CF ${fmt(m.cfN)} · MR ${fmt(m.mrN)}</span>`:'';
    return `<li><span class="n">${i+1}</span><a href="${CF+m.cf}">${m.name}</a>${src}<span class="d">${fmt(m.total)}</span><span class="tag">${G[m.group]}</span></li>`;
  }).join('');

  $('groups').innerHTML=Object.keys(G).map(k=>{
    const cards=mods.filter(m=>m.group===k).sort((a,b)=>b.total-a.total).map(m=>{
      const srv=m.server?`<a href="${m.server}" class="more alt">${m.server.includes('fluxer')?'Join Fluxer':'Join Discord'}</a>`:'';
      const mr=m.mr?`<a href="${MR+m.mr}" class="more alt">Modrinth</a>`:'';
      return `<div class="servicebox"><h3>${m.name}</h3><span class="dl">${fmt(m.total)} downloads</span><p>${m.desc}</p><div class="btns"><a href="${CF+m.cf}" class="more">CurseForge</a>${mr}${srv}</div></div>`;
    }).join('');
    return cards?`<section><h2>${G[k]}</h2><div class="grid">${cards}</div></section>`:'';
  }).join('');

  $('note').textContent=`Download counts are CurseForge + Modrinth. CurseForge numbers last refreshed ${updated}; Modrinth numbers are fetched live.`;
}

(async()=>{
  try{
    const [data,cached]=await Promise.all([getJSON('mods.json'),getJSON('downloads.json')]);
    const dl=cached.mods||{};
    render(data,dl,cached.updated);           // show cached numbers immediately
    const slugs=data.mods.filter(m=>m.mr).map(m=>m.mr);
    try{
      const live=await liveModrinth(slugs);   // then upgrade Modrinth to live values
      data.mods.forEach(m=>{
        if(m.mr&&live[m.mr.toLowerCase()]!=null)dl[m.cf]={...(dl[m.cf]||{}),mr:live[m.mr.toLowerCase()]};
      });
      render(data,dl,cached.updated);
    }catch(e){console.warn('Live Modrinth fetch failed, using cached values',e);}
  }catch(e){
    $('rank').innerHTML='<li class="err">Could not load the list. Serve this page over http(s) (not file://) with mods.json and downloads.json next to it.</li>';
    console.error(e);
  }
})();

(function(){
 const header=document.querySelector('.header'),f=document.createDocumentFragment();
 for(let i=0;i<45;i++){
  const s=document.createElement('div'),z=Math.random()*1.5+1;
  s.className='star';s.style.width=s.style.height=z+'px';
  s.style.left=Math.random()*100+'%';s.style.top=Math.random()*100+'%';
  s.style.setProperty('--move-x',(Math.random()*16-8)+'px');
  s.style.setProperty('--move-y',(Math.random()*16-8)+'px');
  s.style.setProperty('--duration',(Math.random()*3+4)+'s');
  s.style.animationDelay=Math.random()*-4+'s';
  f.appendChild(s);
 }
 header.appendChild(f);
})();
</script>
</body>
</html>
