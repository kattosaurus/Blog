<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta property="og:image" content="https://kattosaur.us/Online.png">
  <meta property="og:title" content="Katto | Character">
  <meta property="og:description" content="Meet one of Katto's original characters.">
  <title>Character | Katto dot online</title>
  <link rel="icon" href="favicon.ico">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/9.1.6/marked.min.js"></script>
  <style>
    :root {
      --bg-color: #121212; --header-bg: #000; --text-main: #fff; --text-muted: #ffffff9a;
      --prof-bg: #ffffff36; --btn-bg: #ffffff20; --btn-text: #fff;
      --dropdown-shadow: rgba(0,0,0,.5); --card-bg: #1a1a1a; --card-border: #ffffff15;
      --section-bg: #ffffff08; --accent: #5865F2; --code-bg: #00000055;
    }
    [data-theme="light"] {
      --bg-color: #f0f0f0; --header-bg: #e0e0e0; --text-main: #121212; --text-muted: #1212129a;
      --prof-bg: #0000001a; --btn-bg: #00000015; --btn-text: #121212;
      --dropdown-shadow: rgba(0,0,0,.1); --card-bg: #fff; --card-border: #00000015;
      --section-bg: #00000008; --accent: #3b42b0; --code-bg: #00000010;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { min-height: 100vh; padding: 76px 16px 48px; background: var(--bg-color); color: var(--text-main); font-family: system-ui,-apple-system,sans-serif; transition: background-color .3s; }
    .controls { position: fixed; top: 15px; left: 15px; right: 15px; display: flex; gap: 10px; z-index: 20; }
    button { font: inherit; color: var(--btn-text); background: var(--btn-bg); border: 0; border-radius: 6px; padding: 8px 12px; cursor: pointer; }
    button:hover { background: var(--prof-bg); }
    .burger { margin-right: auto; background: transparent; font-size: 20px; }
    .dropdown { display: flex; flex-direction: column; position: fixed; top: 60px; left: 15px; min-width: 180px; background: var(--header-bg); border: 1px solid var(--btn-bg); border-radius: 8px; overflow: hidden; box-shadow: 0 8px 24px var(--dropdown-shadow); z-index: 100; opacity: 0; visibility: hidden; transform: translateY(-10px); transition: .2s; }
    .dropdown.show { opacity: 1; visibility: visible; transform: translateY(0); }
    .dropdown a { color: var(--text-main); text-decoration: none; padding: 12px 16px; }
    .dropdown a:hover { background: var(--prof-bg); }
    main { max-width: 900px; margin: 0 auto; }
    .back-link { display: inline-block; margin-bottom: 20px; color: var(--accent); text-decoration: none; }
    .profile { background: var(--card-bg); border: 1px solid var(--card-border); border-radius: 18px; overflow: hidden; }
    .hero { display: grid; grid-template-columns: minmax(180px, 300px) 1fr; gap: 28px; align-items: center; padding: 24px; }
    .hero img { display: block; width: 100%; aspect-ratio: 1; object-fit: cover; border-radius: 12px; background: var(--section-bg); }
    h1 { font-size: clamp(1.8rem, 5vw, 2.8rem); margin-bottom: 12px; }
    .summary { color: var(--text-muted); line-height: 1.65; white-space: pre-line; }
    .markdown { border-top: 1px solid var(--card-border); padding: 28px clamp(20px, 5vw, 48px); line-height: 1.75; overflow-wrap: anywhere; }
    .markdown h1,.markdown h2,.markdown h3,.markdown h4 { margin: 1.4em 0 .55em; line-height: 1.3; }
    .markdown h1:first-child,.markdown h2:first-child,.markdown h3:first-child { margin-top: 0; }
    .markdown p,.markdown ul,.markdown ol,.markdown blockquote,.markdown table,.markdown pre { margin: .9em 0; }
    .markdown ul,.markdown ol { padding-left: 1.6em; }
    .markdown a { color: var(--accent); }
    .markdown img { max-width: 100%; height: auto; display: block; margin: 1em auto; border-radius: 10px; }
    .markdown blockquote { border-left: 3px solid var(--accent); padding: .4em 1em; background: var(--section-bg); color: var(--text-muted); }
    .markdown code { background: var(--code-bg); border-radius: 4px; padding: .12em .35em; }
    .markdown pre { background: var(--code-bg); border-radius: 8px; padding: 14px; overflow-x: auto; }
    .markdown pre code { padding: 0; background: none; }
    .markdown table { border-collapse: collapse; width: 100%; }
    .markdown th,.markdown td { border: 1px solid var(--card-border); padding: 8px 12px; text-align: left; }
    .state { text-align: center; padding: 60px 20px; color: var(--text-muted); }
    .error { color: #ff4747; }
    @media (max-width: 620px) { .hero { grid-template-columns: 1fr; } .hero img { max-width: 320px; margin: auto; } }
  </style>
</head>
<body>
  <div class="controls">
    <button class="burger" aria-label="Toggle navigation" onclick="toggleDropdown()">≡</button>
    <button id="theme-toggle">Theme</button>
  </div>
  <nav class="dropdown" id="dropmeow">
    <a href="index.html">Home</a>
    <a href="portfolio.html">Portfolio</a>
    <a href="characters.html">My characters</a>
    <a href="stories.html">Stories</a>
  </nav>

  <main>
    <a class="back-link" href="characters.html">← All characters</a>
    <article class="profile" id="profile">
      <p class="state">Loading character…</p>
    </article>
  </main>

  <script>
    document.getElementById('theme-toggle').addEventListener('click', () => {
      const root = document.documentElement;
      root.setAttribute('data-theme', root.getAttribute('data-theme') === 'light' ? 'dark' : 'light');
    });
    function toggleDropdown() { document.getElementById('dropmeow').classList.toggle('show'); }
    window.addEventListener('click', event => {
      if (!event.target.closest('.burger') && !event.target.closest('.dropdown')) {
        document.getElementById('dropmeow').classList.remove('show');
      }
    });

    function slugify(name) {
      return name.normalize('NFKD').toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');
    }
    function resolveProfileAsset(path) {
      if (!path || /^(https?:|data:|blob:|#|\/)/i.test(path)) return path;
      return 'ocs/profiles/' + path.replace(/^\.\//, '');
    }
    async function loadProfile() {
      const profileEl = document.getElementById('profile');
      try {
        const name = new URLSearchParams(location.search).get('name');
        if (!name) throw new Error('No character was selected.');
        const response = await fetch('ocs/characters.json', { cache: 'no-cache' });
        if (!response.ok) throw new Error('Could not load the character list.');
        const characters = await response.json();
        const character = characters.find(item => item.name === name);
        if (!character) throw new Error('Character not found.');

        let markdown = '';
        let hasProfile = false;
        const profilePath = `ocs/profiles/${slugify(character.name)}.md`;
        const markdownResponse = await fetch(profilePath, { cache: 'no-cache' });
        if (markdownResponse.ok) {
          markdown = await markdownResponse.text();
          hasProfile = true;
        } else {
          markdown = `# ${character.name}\n\n${character.description || 'Add this character’s description to their Markdown profile.'}`;
        }

        const hero = document.createElement('header');
        hero.className = 'hero';
        const image = document.createElement('img');
        image.src = character.image;
        image.alt = character.name;
        image.onerror = () => { image.hidden = true; };
        const intro = document.createElement('div');
        const title = document.createElement('h1');
        title.textContent = character.name;
        const summary = document.createElement('p');
        summary.className = 'summary';
        summary.textContent = character.description || '';
        intro.append(title, summary);
        hero.append(image, intro);

        const content = document.createElement('div');
        content.className = 'markdown';
        content.innerHTML = marked.parse(markdown);
        content.querySelectorAll('img[src]').forEach(img => img.src = resolveProfileAsset(img.getAttribute('src')));
        content.querySelectorAll('a[href]').forEach(link => {
          const href = link.getAttribute('href');
          if (href && !/^(https?:|mailto:|#|\/)/i.test(href)) link.href = resolveProfileAsset(href);
        });
        profileEl.replaceChildren(hero, content);
        document.title = `${character.name} | Katto dot online`;
        if (!hasProfile) {
          const note = document.createElement('p');
          note.className = 'state';
          note.textContent = `Markdown profile not found. Create ${profilePath} to add a full description.`;
          content.prepend(note);
        }
      } catch (error) {
        console.error(error);
        profileEl.innerHTML = '<p class="state error">Could not load this character profile.</p>';
      }
    }
    loadProfile();
  </script>
</body>
</html>
