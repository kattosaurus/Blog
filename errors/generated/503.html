<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>503 - Service Unavailable</title>
<meta name="description" content="The server is temporarily unavailable.">
<style>
  :root {
    --bg: #000;
    --panel: #efefef;
    --text: #fff;
    --ratio: 3 / 2;
    --ratio-num: 1.5;
    --reserved: 28dvh;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; background: var(--bg); }
  .poster {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    width: 100%; min-height: 100vh; min-height: 100dvh;
    padding: 6dvh 4vw 4dvh; background: var(--bg);
  }
  .image-area {
    width: min(100%, calc((100dvh - var(--reserved)) * var(--ratio-num)));
    aspect-ratio: var(--ratio); background: var(--panel); overflow: hidden;
  }
  .image-area img {
    display: block; width: 100%; height: 100%; max-width: none;
    object-fit: cover; object-position: 50% 50%;
  }
  .caption {
    width: 100%; padding-top: 3dvh; text-align: center;
    color: var(--text); font-family: "Times New Roman", Times, "Liberation Serif", serif;
  }
  .title { font-size: clamp(32px, 7dvh, 72px); line-height: 1.1; font-weight: normal; }
  .description { margin-top: 2.5dvh; font-size: clamp(13px, 2.5dvh, 20px); line-height: 1.2; }
  .home-link { 
    margin-top: 4dvh; color: #888; text-decoration: none; 
    font-size: clamp(12px, 2dvh, 16px); font-family: -apple-system, sans-serif;
    display: inline-block;
  }
  .home-link:hover { color: #fff; }
</style>
</head>
<body>
  <main class="poster">
    <div class="image-area">
      <img src="../assets/service-unavailable.gif" alt="503 Service Unavailable">
    </div>
    <div class="caption">
      <h1 class="title">503</h1>
      <p class="description">The server is temporarily unavailable.</p>
      <a href="/" class="home-link">&larr; Return to safety</a>
    </div>
  </main>
</body>
</html>
