<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="no-socials" content="">
<title>500 - Internal Server Error</title>
<meta name="description" content="Something went wrong on the server's end and it couldn't finish your request. It isn't anything you did, so try again in a bit.">
<style>
  :root {
    --bg: #000;
    --panel: #efefef;
    --text: #fff;
    --ratio: 3 / 2;
    --ratio-num: 1.5;
    --reserved: 28dvh;
    --frame-black: clamp(3px, 0.6vmin, 7px);   /* inner black frame */
    --frame-white: clamp(1px, 0.25vmin, 3px);  /* outer white frame */
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; background: var(--bg); }
  .poster {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    width: 100%; min-height: 100vh; min-height: 100dvh;
    padding: 6dvh 4vw 4dvh; background: var(--bg);
  }
  .image-area {
    width: min(100%, calc((100dvh - var(--reserved)) * var(--ratio-num)));
    aspect-ratio: var(--ratio); background: var(--panel); overflow: hidden;
    /* Double frame: black inner frame, then a white outer frame for separation */
    box-shadow:
      0 0 0 var(--frame-black) #000,
      0 0 0 calc(var(--frame-black) + var(--frame-white)) #fff;
  }
  .image-area img {
    display: block; width: 100%; height: 100%; max-width: none;
    object-fit: cover; object-position: 50% 50%;
  }
  .caption {
    width: 100%; padding-top: 3dvh; text-align: center;
    color: var(--text); font-family: "Times New Roman", Times, "Liberation Serif", serif;
  }
  .title { font-size: clamp(32px, 7dvh, 72px); line-height: 1.1; font-weight: normal; }
  .description { margin-top: 2.5dvh; font-size: clamp(13px, 2.5dvh, 20px); line-height: 1.2; }
</style>
</head>
<body>
  <main class="poster">
    <div class="image-area">
      <img src="../assets/internal-server-error.gif" alt="500 Internal Server Error">
    </div>
    <div class="caption">
      <h1 class="title">500</h1>
      <p class="description">Something went wrong on the server's end and it couldn't finish your request. It isn't anything you did, so try again in a bit.</p>
    </div>
  </main>
</body>
</html>
